<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Effect of direction and touchdown_offset</title><desc>direction minus one mirrors the sweep about the hip. touchdown_offset shifts the whole path in the hip frame after mirroring.</desc>
<defs><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="720" height="450" fill="#ffffff"/>
<text x="360.0" y="30.0" text-anchor="middle" font-size="12" fill="#666" font-weight="400">x = 0 (hip)</text>
<line x1="360.0" y1="38.0" x2="360.0" y2="420.0" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<text x="20.0" y="56.0" text-anchor="start" font-size="13" fill="#222" font-weight="500">direction = +1 (forward)</text>
<path d="M260.0 170.0 L260.2 165.8 L260.8 161.6 L261.8 157.5 L263.3 153.4 L265.1 149.3 L267.3 145.3 L270.0 141.3 L273.0 137.5 L276.3 133.7 L280.1 130.0 L284.2 126.4 L288.6 123.0 L293.4 119.7 L298.5 116.5 L303.9 113.4 L309.6 110.5 L315.6 107.8 L321.8 105.3 L328.3 102.9 L335.0 100.7 L341.9 98.7 L349.0 96.9 L356.2 95.3 L363.6 93.9 L371.2 92.7 L378.8 91.7 L386.5 91.0 L394.3 90.4 L402.1 90.1 L410.0 90.0 L417.9 90.1 L425.7 90.4 L433.5 91.0 L441.2 91.7 L448.8 92.7 L456.4 93.9 L463.8 95.3 L471.0 96.9 L478.1 98.7 L485.0 100.7 L491.7 102.9 L498.2 105.3 L504.4 107.8 L510.4 110.5 L516.1 113.4 L521.5 116.5 L526.6 119.7 L531.4 123.0 L535.8 126.4 L539.9 130.0 L543.7 133.7 L547.0 137.5 L550.0 141.3 L552.7 145.3 L554.9 149.3 L556.7 153.4 L558.2 157.5 L559.2 161.6 L559.8 165.8 L560.0 170.0" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac)"/>
<line x1="560.0" y1="170.0" x2="256.0" y2="170.0" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#at)"/>
<circle cx="560.0" cy="170.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="260.0" cy="170.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="410.0" y="192.0" text-anchor="middle" font-size="12" fill="#222" font-weight="400" paint-order="stroke" stroke="#fff" stroke-width="5">stance: foot moves toward −x, pushes body forward</text>
<text x="410.0" y="76.0" text-anchor="middle" font-size="12" fill="#222" font-weight="400" paint-order="stroke" stroke="#fff" stroke-width="5">swing: foot moves toward +x</text>
<line x1="360.0" y1="214.0" x2="410.0" y2="214.0" stroke="#333" stroke-width="1.2" marker-start="url(#ad)" marker-end="url(#ad)"/>
<text x="424.0" y="218.0" text-anchor="start" font-size="12" fill="#222" font-weight="400">o = touchdown_offset: whole path shifts by o</text>
<text x="20.0" y="256.0" text-anchor="start" font-size="13" fill="#222" font-weight="500">direction = −1 (backward)</text>
<path d="M560.0 360.0 L559.8 355.8 L559.2 351.6 L558.2 347.5 L556.7 343.4 L554.9 339.3 L552.7 335.3 L550.0 331.3 L547.0 327.5 L543.7 323.7 L539.9 320.0 L535.8 316.4 L531.4 313.0 L526.6 309.7 L521.5 306.5 L516.1 303.4 L510.4 300.5 L504.4 297.8 L498.2 295.3 L491.7 292.9 L485.0 290.7 L478.1 288.7 L471.0 286.9 L463.8 285.3 L456.4 283.9 L448.8 282.7 L441.2 281.7 L433.5 281.0 L425.7 280.4 L417.9 280.1 L410.0 280.0 L402.1 280.1 L394.3 280.4 L386.5 281.0 L378.8 281.7 L371.2 282.7 L363.6 283.9 L356.2 285.3 L349.0 286.9 L341.9 288.7 L335.0 290.7 L328.3 292.9 L321.8 295.3 L315.6 297.8 L309.6 300.5 L303.9 303.4 L298.5 306.5 L293.4 309.7 L288.6 313.0 L284.2 316.4 L280.1 320.0 L276.3 323.7 L273.0 327.5 L270.0 331.3 L267.3 335.3 L265.1 339.3 L263.3 343.4 L261.8 347.5 L260.8 351.6 L260.2 355.8 L260.0 360.0" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac)"/>
<line x1="260.0" y1="360.0" x2="564.0" y2="360.0" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#at)"/>
<circle cx="260.0" cy="360.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="560.0" cy="360.0" r="4.5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="410.0" y="382.0" text-anchor="middle" font-size="12" fill="#222" font-weight="400" paint-order="stroke" stroke="#fff" stroke-width="5">stance: foot moves toward +x, pushes body backward</text>
<text x="410.0" y="266.0" text-anchor="middle" font-size="12" fill="#222" font-weight="400" paint-order="stroke" stroke="#fff" stroke-width="5">swing: foot moves toward −x</text>
<line x1="360.0" y1="404.0" x2="410.0" y2="404.0" stroke="#333" stroke-width="1.2" marker-start="url(#ad)" marker-end="url(#ad)"/>
<text x="424.0" y="408.0" text-anchor="start" font-size="12" fill="#222" font-weight="400">same o: offset is applied after the mirror</text>
<text x="20.0" y="436.0" text-anchor="start" font-size="12" fill="#666" font-weight="400">x_out = direction · x + touchdown_offset &#160;(o drawn exaggerated at 0.05 m)</text>
</svg>
