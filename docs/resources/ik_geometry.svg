<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Two-link leg geometry for inverse kinematics</title><desc>Triangle of thigh, shin and the hip-to-ankle line d, with the angles phi, alpha and the knee inner angle.</desc>
<defs><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="720" height="470" fill="#ffffff"/>
<text x="20.0" y="30.0" text-anchor="start" font-size="12" fill="#666" font-weight="400">Example: foot target x = 0.15, y = 0.80 (touchdown), l1 = l2 = 0.45</text>
<line x1="260.0" y1="50.0" x2="260.0" y2="392.0" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<text x="248.0" y="300.0" text-anchor="end" font-size="12" fill="#666" font-weight="400">y</text>
<line x1="260.0" y1="370.0" x2="320.0" y2="370.0" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<text x="290.0" y="386.0" text-anchor="middle" font-size="12" fill="#666" font-weight="400">x</text>
<line x1="260.0" y1="50.0" x2="320.0" y2="370.0" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="280.0" y="214.0" text-anchor="end" font-size="14" fill="#555" font-weight="500">d</text>
<line x1="260.0" y1="50.0" x2="365.5" y2="195.8" stroke="#444" stroke-width="5"/>
<line x1="365.5" y1="195.8" x2="320.0" y2="370.0" stroke="#444" stroke-width="5"/>
<text x="330.7" y="116.9" text-anchor="start" font-size="12" fill="#222" font-weight="400">l1 (thigh)</text>
<text x="360.7" y="288.9" text-anchor="start" font-size="12" fill="#222" font-weight="400">l2 (shin)</text>
<path d="M260.0 120.0 L260.3 120.0 L260.6 120.0 L261.0 120.0 L261.3 120.0 L261.6 120.0 L261.9 120.0 L262.3 120.0 L262.6 120.0 L262.9 119.9 L263.2 119.9 L263.6 119.9 L263.9 119.9 L264.2 119.9 L264.5 119.9 L264.9 119.8 L265.2 119.8 L265.5 119.8 L265.8 119.8 L266.2 119.7 L266.5 119.7 L266.8 119.7 L267.1 119.6 L267.4 119.6 L267.8 119.6 L268.1 119.5 L268.4 119.5 L268.7 119.5 L269.1 119.4 L269.4 119.4 L269.7 119.3 L270.0 119.3 L270.3 119.2 L270.7 119.2 L271.0 119.1 L271.3 119.1 L271.6 119.0 L271.9 119.0 L272.3 118.9 L272.6 118.9 L272.9 118.8" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M272.9 118.8 L273.7 118.7 L274.4 118.5 L275.2 118.3 L275.9 118.2 L276.7 118.0 L277.4 117.8 L278.2 117.6 L278.9 117.4 L279.7 117.2 L280.4 117.0 L281.1 116.7 L281.9 116.5 L282.6 116.3 L283.3 116.0 L284.0 115.7 L284.8 115.5 L285.5 115.2 L286.2 114.9 L286.9 114.6 L287.6 114.3 L288.3 114.0 L289.0 113.7 L289.7 113.4 L290.4 113.0 L291.1 112.7 L291.8 112.3 L292.5 112.0 L293.2 111.6 L293.9 111.3 L294.5 110.9 L295.2 110.5 L295.9 110.1 L296.5 109.7 L297.2 109.3 L297.8 108.9 L298.5 108.5 L299.1 108.0 L299.8 107.6 L300.4 107.2 L301.0 106.7" fill="none" stroke="#993C1D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="264.3" y1="119.7" x2="252.0" y2="112.0" stroke="#999" stroke-width="0.8"/>
<text x="248.0" y="110.0" text-anchor="end" font-size="12" fill="#185FA5" font-weight="400">φ = atan2(x, y)</text>
<text x="298.7" y="145.0" text-anchor="middle" font-size="15" fill="#993C1D" font-weight="500">α</text>
<line x1="365.5" y1="195.8" x2="406.5" y2="252.6" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M353.9 240.4 L354.9 240.6 L355.8 240.8 L356.8 241.0 L357.8 241.2 L358.8 241.4 L359.8 241.5 L360.8 241.6 L361.9 241.7 L362.9 241.8 L363.9 241.8 L364.9 241.8 L365.9 241.8 L366.9 241.8 L367.9 241.8 L368.9 241.7 L370.0 241.6 L371.0 241.5 L372.0 241.4 L373.0 241.2 L374.0 241.1 L375.0 240.9 L376.0 240.6 L376.9 240.4 L377.9 240.1 L378.9 239.8 L379.9 239.5 L380.8 239.2 L381.8 238.9 L382.7 238.5 L383.7 238.1 L384.6 237.7 L385.5 237.3 L386.4 236.8 L387.3 236.3 L388.2 235.9 L389.1 235.3 L389.9 234.8 L390.8 234.3 L391.6 233.7 L392.5 233.1" fill="none" stroke="#0F6E56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="376.0" y1="241.1" x2="425.0" y2="232.0" stroke="#999" stroke-width="0.8"/>
<text x="428.0" y="236.0" text-anchor="start" font-size="12" fill="#0F6E56" font-weight="400">knee = π − inner</text>
<path d="M350.3 174.8 L349.1 175.7 L348.0 176.6 L346.9 177.7 L345.9 178.7 L345.0 179.9 L344.1 181.0 L343.3 182.3 L342.6 183.5 L341.9 184.9 L341.3 186.2 L340.8 187.6 L340.4 189.0 L340.1 190.4 L339.8 191.9 L339.6 193.3 L339.5 194.8 L339.5 196.3 L339.6 197.7 L339.7 199.2 L339.9 200.6 L340.3 202.1 L340.6 203.5 L341.1 204.9 L341.7 206.2 L342.3 207.6 L343.0 208.9 L343.8 210.1 L344.6 211.3 L345.5 212.5 L346.5 213.6 L347.5 214.6 L348.6 215.6 L349.7 216.5 L350.9 217.4 L352.2 218.2 L353.5 218.9 L354.8 219.5 L356.1 220.1 L357.5 220.6 L358.9 221.0" fill="none" stroke="#7A6A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="331.5" y="207.8" text-anchor="end" font-size="12" fill="#7A6A00" font-weight="400">inner</text>
<circle cx="260.0" cy="50.0" r="6" fill="#ddd" stroke="#333" stroke-width="1.5"/>
<text x="272.0" y="44.0" text-anchor="start" font-size="12" fill="#222" font-weight="500">hip</text>
<circle cx="365.5" cy="195.8" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="375.5" y="185.8" text-anchor="start" font-size="12" fill="#222" font-weight="500">knee</text>
<circle cx="320.0" cy="370.0" r="5" fill="#D85A30" stroke="#993C1D" stroke-width="1.5"/>
<text x="332.0" y="376.0" text-anchor="start" font-size="12" fill="#993C1D" font-weight="500">ankle target (x, y)</text>
<text x="40.0" y="430.0" text-anchor="start" font-size="13" fill="#222" font-weight="400">cos(inner) = (l1² + l2² − d²) / (2·l1·l2)  →  knee = π − inner</text>
<text x="40.0" y="452.0" text-anchor="start" font-size="13" fill="#222" font-weight="400">cos(α) = (l1² + d² − l2²) / (2·l1·d)  →  hip = −(φ + α)</text>
</svg>
