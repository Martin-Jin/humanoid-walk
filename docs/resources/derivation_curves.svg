<text x="288.0" y="50.0" text-anchor="middle" font-size="13" fill="#0F6E56" font-weight="500">Stance</text>
<text x="288.0" y="68.0" text-anchor="middle" font-size="12" fill="#0F6E56" font-weight="400">s = p / duty_factor</text>
<text x="568.0" y="50.0" text-anchor="middle" font-size="13" fill="#993C1D" font-weight="500">Swing</text>
<text x="568.0" y="68.0" text-anchor="middle" font-size="12" fill="#993C1D" font-weight="400">s = (p − duty_factor) / (1 − duty_factor)</text>
<text x="120.0" y="96.0" text-anchor="middle" font-size="12" fill="#666" font-weight="400">p = 0</text>
<text x="456.0" y="96.0" text-anchor="middle" font-size="12" fill="#666" font-weight="400">p = duty_factor</text>
<text x="680.0" y="96.0" text-anchor="middle" font-size="12" fill="#666" font-weight="400">p = 1</text>
