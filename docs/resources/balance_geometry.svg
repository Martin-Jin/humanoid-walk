<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Torso balance: measuring the lean and the torque pair that corrects it</title><desc>Left: torso pitch theta and its rate omega are measured. Right: the hip target shift makes the hip PD push the thigh with plus tau and the torso with minus tau, which turns the torso back upright.</desc>
<defs><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="720" height="460" fill="#ffffff"/>
<text x="40" y="28" font-size="13" fill="#222" font-weight="500">1. What is measured (forward lean)</text>
<text x="380" y="28" font-size="13" fill="#222" font-weight="500">2. What the hip applies</text>

<!-- left panel -->
<line x1="40" y1="384" x2="340" y2="384" stroke="#999" stroke-width="2"/>
<line x1="180" y1="260" x2="180" y2="115" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<text x="150" y="120" text-anchor="end" font-size="11" fill="#666">vertical</text>
<line x1="180" y1="260" x2="180" y2="380" stroke="#444" stroke-width="6" stroke-linecap="round"/>
<line x1="180" y1="260" x2="224.5" y2="137.8" stroke="#222" stroke-width="8" stroke-linecap="round"/>
<path d="M180 190 A70 70 0 0 1 203.9 194.2" fill="none" stroke="#185FA5" stroke-width="2"/>
<text x="214" y="186" font-size="14" fill="#185FA5" font-weight="500">θ</text>
<path d="M180 110 A150 150 0 0 1 231.3 119" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#ab)"/>
<text x="240" y="116" font-size="12" fill="#185FA5">ω (lean rate)</text>
<circle cx="180" cy="260" r="6" fill="#ddd" stroke="#333" stroke-width="1.5"/>
<text x="168" y="266" text-anchor="end" font-size="12" fill="#222" font-weight="500">hip</text>
<text x="196" y="330" font-size="12" fill="#222">legs</text>
<text x="40" y="412" font-size="12" fill="#666">Read every frame: θ = torso angle,</text>
<text x="40" y="428" font-size="12" fill="#666">ω = torso angular velocity. + is clockwise.</text>

<!-- right panel -->
<line x1="380" y1="384" x2="680" y2="384" stroke="#999" stroke-width="2"/>
<line x1="520" y1="260" x2="520" y2="115" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="520" y1="260" x2="520" y2="380" stroke="#444" stroke-width="6" stroke-linecap="round"/>
<line x1="520" y1="260" x2="564.5" y2="137.8" stroke="#222" stroke-width="8" stroke-linecap="round"/>
<path d="M571.3 119 A150 150 0 0 0 520 110" fill="none" stroke="#993C1D" stroke-width="2.2" marker-end="url(#ac)"/>
<text x="578" y="112" font-size="12" fill="#993C1D" font-weight="500">−τ on torso</text>
<text x="578" y="128" font-size="12" fill="#993C1D">turns it back upright</text>
<path d="M520 330 A70 70 0 0 1 475 313.6" fill="none" stroke="#0F6E56" stroke-width="2.2" marker-end="url(#at)"/>
<text x="468" y="326" text-anchor="end" font-size="12" fill="#0F6E56" font-weight="500">+τ on thigh</text>
<text x="468" y="342" text-anchor="end" font-size="12" fill="#0F6E56">(foot planted, barely moves)</text>
<circle cx="520" cy="260" r="6" fill="#ddd" stroke="#333" stroke-width="1.5"/>
<text x="380" y="412" font-size="12" fill="#666">Hip target moves by +kp·θ + kd·ω, so the hip PD pushes</text>
<text x="380" y="428" font-size="12" fill="#666">+τ on the thigh and an equal −τ on the torso.</text>
<text x="380" y="444" font-size="12" fill="#666">Stance foot is planted, so the torso takes the rotation.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
