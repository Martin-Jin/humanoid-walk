<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>

  <!-- Panel 1: COM ahead of ankle -->
  <g>
    <text x="190" y="24" text-anchor="middle" font-weight="bold" fill="#222">1. COM ahead of the ankle</text>
    <line x1="20" y1="235" x2="360" y2="235" stroke="#555" stroke-width="2"/>
    <rect x="130" y="215" width="105" height="20" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
    <rect x="130" y="215" width="105" height="20" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="6 4" transform="rotate(14 180 215)"/>
    <line x1="180" y1="215" x2="180" y2="90" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <circle cx="180" cy="215" r="5" fill="#333"/>
    <circle cx="250" cy="110" r="9" fill="#d9534f"/>
    <text x="250" y="90" text-anchor="middle" fill="#d9534f">COM</text>
    <line x1="250" y1="119" x2="250" y2="215" stroke="#d9534f" stroke-dasharray="4 4"/>
    <line x1="180" y1="180" x2="250" y2="180" stroke="#d9534f" stroke-width="2" marker-end="url(#ahr)" marker-start="url(#ahr)"/>
    <text x="215" y="172" text-anchor="middle" fill="#d9534f">com_dx &gt; 0</text>
    <line x1="262" y1="110" x2="318" y2="110" stroke="#d9534f" stroke-width="2.5" marker-end="url(#ahr)"/>
    <text x="290" y="130" text-anchor="middle" fill="#d9534f">com_vx &gt; 0</text>
    <line x1="170" y1="60" x2="110" y2="60" stroke="#2e8b57" stroke-width="3" marker-end="url(#ahg)"/>
    <text x="140" y="50" text-anchor="middle" fill="#2e8b57">body pushed back</text>
    <text x="190" y="270" text-anchor="middle" fill="#222">balance &gt; 0: target toes down</text>
    <text x="190" y="290" text-anchor="middle" fill="#666">(dashed = target, grey = actual)</text>
  </g>

  <!-- Panel 2: COM behind ankle -->
  <g transform="translate(380,0)">
    <text x="190" y="24" text-anchor="middle" font-weight="bold" fill="#222">2. COM behind the ankle</text>
    <line x1="20" y1="235" x2="360" y2="235" stroke="#555" stroke-width="2"/>
    <rect x="130" y="215" width="105" height="20" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
    <rect x="130" y="215" width="105" height="20" fill="none" stroke="#2e8b57" stroke-width="2" stroke-dasharray="6 4" transform="rotate(-14 180 215)"/>
    <line x1="180" y1="215" x2="180" y2="90" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <circle cx="180" cy="215" r="5" fill="#333"/>
    <circle cx="110" cy="110" r="9" fill="#d9534f"/>
    <text x="110" y="90" text-anchor="middle" fill="#d9534f">COM</text>
    <line x1="110" y1="119" x2="110" y2="215" stroke="#d9534f" stroke-dasharray="4 4"/>
    <line x1="180" y1="180" x2="110" y2="180" stroke="#d9534f" stroke-width="2" marker-end="url(#ahr)" marker-start="url(#ahr)"/>
    <text x="145" y="172" text-anchor="middle" fill="#d9534f">com_dx &lt; 0</text>
    <line x1="98" y1="110" x2="42" y2="110" stroke="#d9534f" stroke-width="2.5" marker-end="url(#ahr)"/>
    <text x="70" y="130" text-anchor="middle" fill="#d9534f">com_vx &lt; 0</text>
    <line x1="190" y1="60" x2="250" y2="60" stroke="#2e8b57" stroke-width="3" marker-end="url(#ahg)"/>
    <text x="225" y="50" text-anchor="middle" fill="#2e8b57">body pushed forward</text>
    <text x="190" y="270" text-anchor="middle" fill="#222">balance &lt; 0: target toes up</text>
    <text x="190" y="290" text-anchor="middle" fill="#666">(forward is right)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
