<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" width="720" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<title>Hip target correction versus torso pitch and rate</title><desc>Two straight lines through the origin. The pitch term has slope kp 0.8 and the rate term has slope kd 0.2. The two are added.</desc>
<rect width="720" height="345" fill="#ffffff"/>
<text x="70" y="28" font-size="13" fill="#222" font-weight="500">Pitch term (ω = 0)</text>
<text x="410" y="28" font-size="13" fill="#222" font-weight="500">Rate term (θ = 0)</text>

<!-- left plot: centre (200,150), 650 px/rad horizontally, 450 px/rad vertically -->
<text x="62" y="48" text-anchor="end" font-size="11" fill="#666">offset (rad)</text>
<line x1="70" y1="60" x2="330" y2="60" stroke="#ddd" stroke-dasharray="3 3"/>
<line x1="70" y1="240" x2="330" y2="240" stroke="#ddd" stroke-dasharray="3 3"/>
<line x1="70" y1="150" x2="330" y2="150" stroke="#999"/>
<line x1="200" y1="55" x2="200" y2="245" stroke="#999"/>
<text x="62" y="64" text-anchor="end" font-size="11" fill="#666">+0.2</text>
<text x="62" y="154" text-anchor="end" font-size="11" fill="#666">0</text>
<text x="62" y="244" text-anchor="end" font-size="11" fill="#666">−0.2</text>
<text x="70" y="262" text-anchor="middle" font-size="11" fill="#666">−0.2</text>
<text x="200" y="262" text-anchor="middle" font-size="11" fill="#666">0</text>
<text x="330" y="262" text-anchor="middle" font-size="11" fill="#666">+0.2</text>
<text x="200" y="280" text-anchor="middle" font-size="12" fill="#666">θ (rad, + = forward lean)</text>
<line x1="70" y1="222" x2="330" y2="78" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="265" cy="114" r="4" fill="#fff" stroke="#185FA5" stroke-width="1.5"/>
<text x="260" y="100" text-anchor="end" font-size="11" fill="#666">+0.08 at θ = 0.10</text>
<text x="262" y="176" font-size="12" fill="#185FA5">slope kp = 0.8</text>

<!-- right plot: centre (540,150), 130 px/rad horizontally, 450 px/rad vertically -->
<line x1="410" y1="60" x2="670" y2="60" stroke="#ddd" stroke-dasharray="3 3"/>
<line x1="410" y1="240" x2="670" y2="240" stroke="#ddd" stroke-dasharray="3 3"/>
<line x1="410" y1="150" x2="670" y2="150" stroke="#999"/>
<line x1="540" y1="55" x2="540" y2="245" stroke="#999"/>
<text x="402" y="64" text-anchor="end" font-size="11" fill="#666">+0.2</text>
<text x="402" y="154" text-anchor="end" font-size="11" fill="#666">0</text>
<text x="402" y="244" text-anchor="end" font-size="11" fill="#666">−0.2</text>
<text x="410" y="262" text-anchor="middle" font-size="11" fill="#666">−1</text>
<text x="540" y="262" text-anchor="middle" font-size="11" fill="#666">0</text>
<text x="670" y="262" text-anchor="middle" font-size="11" fill="#666">+1</text>
<text x="540" y="280" text-anchor="middle" font-size="12" fill="#666">ω (rad/s, + = falling forward)</text>
<line x1="410" y1="240" x2="670" y2="60" stroke="#993C1D" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="605" cy="105" r="4" fill="#fff" stroke="#993C1D" stroke-width="1.5"/>
<text x="598" y="90" text-anchor="end" font-size="11" fill="#666">+0.10 at ω = 0.5</text>
<text x="560" y="190" font-size="12" fill="#993C1D">slope kd = 0.2</text>

<text x="40" y="308" font-size="13" fill="#222">offset = kp·θ + kd·ω,  added to both hip targets</text>
<text x="40" y="328" font-size="13" fill="#666">Example: θ = 0.10 rad, ω = 0.50 rad/s  →  +0.08 + 0.10 = +0.18 rad</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
