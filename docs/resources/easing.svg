<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Easing and lift functions used in swing</title><desc>Cosine ease goes from 0 to 1 with zero slope at both ends. Sine lift is 0 at both ends and 1 at the middle.</desc>
<defs><marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="720" height="300" fill="#ffffff"/>
<text x="70.0" y="34.0" text-anchor="start" font-size="13" fill="#222" font-weight="500">Swing x progress</text>
<line x1="70.0" y1="60.0" x2="70.0" y2="240.0" stroke="#999" stroke-width="1"/>
<line x1="70.0" y1="240.0" x2="330.0" y2="240.0" stroke="#999" stroke-width="1"/>
<line x1="70.0" y1="60.0" x2="330.0" y2="60.0" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
<text x="62.0" y="244.0" text-anchor="end" font-size="11" fill="#666" font-weight="400">0</text>
<text x="62.0" y="64.0" text-anchor="end" font-size="11" fill="#666" font-weight="400">1</text>
<text x="70.0" y="258.0" text-anchor="middle" font-size="11" fill="#666" font-weight="400">s = 0</text>
<text x="200.0" y="258.0" text-anchor="middle" font-size="11" fill="#666" font-weight="400">s = ½</text>
<text x="330.0" y="258.0" text-anchor="middle" font-size="11" fill="#666" font-weight="400">s = 1</text>
<text x="70.0" y="285.0" text-anchor="start" font-size="13" fill="#222" font-weight="400">x = −L/2 + L · ½(1 − cos πs)</text>
<text x="410.0" y="34.0" text-anchor="start" font-size="13" fill="#222" font-weight="500">Swing lift</text>
<line x1="410.0" y1="60.0" x2="410.0" y2="240.0" stroke="#999" stroke-width="1"/>
<line x1="410.0" y1="240.0" x2="670.0" y2="240.0" stroke="#999" stroke-width="1"/>
<line x1="410.0" y1="60.0" x2="670.0" y2="60.0" stroke="#ddd" stroke-width="1" stroke-dasharray="3 3"/>
<text x="402.0" y="244.0" text-anchor="end" font-size="11" fill="#666" font-weight="400">0</text>
<text x="402.0" y="64.0" text-anchor="end" font-size="11" fill="#666" font-weight="400">1</text>
<text x="410.0" y="258.0" text-anchor="middle" font-size="11" fill="#666" font-weight="400">s = 0</text>
<text x="540.0" y="258.0" text-anchor="middle" font-size="11" fill="#666" font-weight="400">s = ½</text>
<text x="670.0" y="258.0" text-anchor="middle" font-size="11" fill="#666" font-weight="400">s = 1</text>
<text x="410.0" y="285.0" text-anchor="start" font-size="13" fill="#222" font-weight="400">y = H − h · sin(πs)</text>
<line x1="70.0" y1="240.0" x2="330.0" y2="60.0" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4"/>
