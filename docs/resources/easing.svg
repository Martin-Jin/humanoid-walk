<text x="80.0" y="84.0" text-anchor="start" font-size="12" fill="#666" font-weight="400">dashed: linear s (abrupt)</text>
<text x="80.0" y="100.0" text-anchor="start" font-size="12" fill="#993C1D" font-weight="400">solid: cosine ease</text>
<text x="215.0" y="205.0" text-anchor="start" font-size="12" fill="#222" font-weight="400">zero slope at</text>
<text x="215.0" y="221.0" text-anchor="start" font-size="12" fill="#222" font-weight="400">s = 0 and s = 1</text>
<path d="M410.0 240.0 L413.2 232.9 L416.5 225.9 L419.8 218.8 L423.0 211.8 L426.2 204.9 L429.5 198.0 L432.8 191.1 L436.0 184.4 L439.2 177.7 L442.5 171.1 L445.8 164.6 L449.0 158.3 L452.2 152.0 L455.5 146.0 L458.8 140.0 L462.0 134.2 L465.2 128.6 L468.5 123.1 L471.8 117.8 L475.0 112.7 L478.2 107.8 L481.5 103.1 L484.8 98.6 L488.0 94.4 L491.2 90.3 L494.5 86.5 L497.8 83.0 L501.0 79.6 L504.2 76.5 L507.5 73.7 L510.8 71.1 L514.0 68.8 L517.2 66.8 L520.5 65.0 L523.8 63.5 L527.0 62.2 L530.2 61.2 L533.5 60.6 L536.8 60.1 L540.0 60.0 L543.2 60.1 L546.5 60.6 L549.8 61.2 L553.0 62.2 L556.2 63.5 L559.5 65.0 L562.8 66.8 L566.0 68.8 L569.2 71.1 L572.5 73.7 L575.8 76.5 L579.0 79.6 L582.2 83.0 L585.5 86.5 L588.8 90.3 L592.0 94.4 L595.2 98.6 L598.5 103.1 L601.8 107.8 L605.0 112.7 L608.2 117.8 L611.5 123.1 L614.8 128.6 L618.0 134.2 L621.2 140.0 L624.5 146.0 L627.8 152.0 L631.0 158.3 L634.2 164.6 L637.5 171.1 L640.8 177.7 L644.0 184.4 L647.2 191.1 L650.5 198.0 L653.8 204.9 L657.0 211.8 L660.2 218.8 L663.5 225.9 L666.8 232.9 L670.0 240.0" fill="none" stroke="#D85A30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540.0" y="196.0" text-anchor="middle" font-size="12" fill="#222" font-weight="400">lift = h · sin(πs)</text>
<text x="540.0" y="212.0" text-anchor="middle" font-size="12" fill="#222" font-weight="400">0 at both ends, h at s = ½</text>
</svg>
