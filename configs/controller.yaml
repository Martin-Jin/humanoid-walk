# Controller gains. Output is torque in N·m, error is target - current in rad.
# Kp: N·m/rad          (positive torque turns the joint toward positive angle)
# Ki: N·m/(rad·s)      (integrates error over time)
# Kd: N·m·s/rad        (subtracts angular velocity, so positive Kd = damping)
# integral_limit: rad·s, clamps the integral term (anti-windup)
#
# Gains are sized per joint group from segment inertia, assuming sim_hz ≈ 60.
# Kd is kept low enough that explicit stepping stays stable (Kd·dt / inertia < 2).
# Each joint (one per JointName value) must appear in exactly one `joints` list.
Controller:
  PD_LEG: # knee
    joints: [knee_l, knee_r]
    type: PD
    gains:
      Kp: 250.0 # saturates at ~0.8 rad error for a 200 N·m joint
      Kd: 25.0
  PD_ANKLE: # holds the whole body upright about the ankle
    joints: [ankle_l, ankle_r]
    type: PD
    gains:
      Kp: 1500.0 # > ~700 N·m/rad of gravity tipping torque
      Kd: 15.0 # kept low: foot inertia ~0.02 kg·m², Kd·dt/I must stay < 2
  PD_HIP: # keeps the torso upright over the legs
    joints: [hip_l, hip_r]
    type: PD
    gains:
      Kp: 600.0
      Kd: 40.0
  PD_ARM:
    joints: [shoulder_l, shoulder_r]
    type: PD
    gains:
      Kp: 60.0
      Kd: 8.0
  PD_NECK:
    joints: [neck]
    type: PD
    gains:
      Kp: 20.0
      Kd: 1.0
  PID_LEG: # like PD_LEG, plus Ki to remove steady gravity sag (currently unassigned)
    joints: []
    type: PID
    gains:
      Kp: 250.0
      Ki: 20.0
      Kd: 25.0
      integral_limit: 5.0 # Ki · limit = 100 N·m max integral contribution

