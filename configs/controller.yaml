# Controller configuration
Controller:
  PID:
    gains:
      Kp: 1.0
      Ki: 0.1
      Kd: 0.05
      integral_limit: 10.0
    type: PID
  P:
    gains:
      Kp: 1.0
    type: P
  PD:
    gains:
      Kp: 1.0
      Kd: 0.05
    type: PD
  PI:
    gains:
      Kp: 1.0
      Ki: 0.1
      integral_limit: 10.0
    type: PI

# One entry per JointName value; `type` selects a key from Controller above
JointController:
  neck:
    type: PID
  shoulder_l:
    type: PID
  shoulder_r:
    type: PID
  hip_l:
    type: PID
  hip_r:
    type: PID
  knee_l:
    type: PID
  knee_r:
    type: PID
  ankle_l:
    type: PID
  ankle_r:
    type: PID
