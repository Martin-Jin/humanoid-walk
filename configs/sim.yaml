#Config file for the simulation environment.

world:
  gravity_mps2: 9.81 # derived from jump height and time to peak
  sim_hz: 60 # fixed timestep (1/60)
  arena_width_m: 12.0
  floor_y_m: 0.0
  floor_friction: 100 # pymunk shape friction, dimensionless
  physics_substeps: 8 # physics steps per frame; torques are recomputed each one
  ground_thickness_m: 0.2 # m, thickness of the static ground segment
  spawn_x_frac: 0.2 # humanoid spawns at this fraction of the screen width
  contact_hold_s: 0.03 # s, a foot counts as on the ground this long after it last touched
  max_body_speed_mps: 10.0 # m/s, cap on the speed of any body (keeps the solver stable)

