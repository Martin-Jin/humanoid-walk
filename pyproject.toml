[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-walk"
version = "0.1.0"
description = "A 2D humanoid that learns to walk, with RL and classical control, shown in pygame."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium",
    "numpy",
    "pygame-ce",
    "pymunk",
    "PyYAML",
]

[project.optional-dependencies]
cpu = [
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanoid_walk = ["**/*.yaml"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E501"]
